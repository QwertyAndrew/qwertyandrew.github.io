<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QA's Portfolio</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <!-- For mobile layout -->
    <button class="menu-button" aria-label="Open navigation">
        <img src="assets/images/icons/menu.svg" alt="">
    </button>

    <!-- Navigation bar on the left -->
    <nav>
        <ul>
            <li>
                <a href="#art" class="nav-link active">
                    <div class="nav-link-indicator">
                        <div class="nav-link-line"></div>
                    </div>
                    Works
                </a>

                <ul class="nav-submenu">
                    <li>
                        <a href="#art" class="nav-sublink">Art</a>
                        <div class="nav-sublink-indicator active">
                            <div class="diamond"></div>
                        </div>
                    </li>
                    <li>
                        <a href="#photos" class="nav-sublink">Photos</a>
                        <div class="nav-sublink-indicator">
                            <div class="diamond"></div>
                        </div>
                    </li>
                    <li>
                        <a href="#games" class="nav-sublink">Games</a>
                        <div class="nav-sublink-indicator">
                            <div class="diamond"></div>
                        </div>
                    </li>
                    <li>
                        <a href="#websites" class="nav-sublink">Websites</a>
                        <div class="nav-sublink-indicator">
                            <div class="diamond"></div>
                        </div>
                    </li>
                    <li>
                        <a href="#music" class="nav-sublink">Music</a>
                        <div class="nav-sublink-indicator">
                            <div class="diamond"></div>
                        </div>
                    </li>
                </ul>
            </li>

            <li>
                <a href="blog.html" class="nav-link">
                    <div class="nav-link-indicator"></div>
                    Blog
                </a>
            </li>

            <li>
                <a href="about.html" class="nav-link">
                    <div class="nav-link-indicator"></div>
                    About
                </a>
            </li>
        </ul>

        <img class="navBGImage" alt="" />
        <div class="line"></div>
    </nav>

    <main>
        <section id="art" class="page active">
            <div class="art-gallery gallery"></div>

            <article class="detailed"> <!-- active or not -->
                <button class="detailed-close" aria-label="Close image">
                    X
                </button>
                <div class="content-container">
                    <div class="media-container"></div>

                    <div class="text-group">
                        <h1></h1>
                        <p></p>
                    </div>
                </div>
            </article>
        </section>

        <section id="photos" class="page">
            <div class="photos-gallery gallery"></div>
            <article class="detailed"> <!-- active or not -->
                <button class="detailed-close" aria-label="Close image">
                    X
                </button>
                <div class="content-container">
                    <div class="media-container"></div>

                    <div class="text-group">
                        <h1></h1>
                        <p></p>
                    </div>
                </div>
            </article>
        </section>

        <section id="music" class="page">
            <!-- 2 Sides, the left and the right side -->

            <!-- LEFT SIDE -->
            <div class="trackList">
                <!-- Using a template provided in music.js -->
            </div>

            <!-- RIGHT SIDE -->
            <div class="discContainer">
                <!-- rotate the cd with "playing" -->
                <div class="cd">
                    <div class="cdOverlay"></div>
                    <div class="cdShine"></div>
                    <img src="assets/images/works/arts/samplicityicon.png" class="cdCover" alt="">
                    <div class="middleCircle"></div>
                    <div class="secMiddleCircle"></div>
                    <div class="thirdMiddleCircle"></div>
                </div>

                <div class="cdBG">
                    <svg viewBox="0 0 100 100">
                        <defs>
                            <path id="cdTextPath" d="M 50, 5
                   a 45,45 0 1,1 0,90
                   a 45,45 0 1,1 0,-90" />
                        </defs>

                        <g class="cdText cdText-default">
                            <text>
                                <textPath href="#cdTextPath" textLength="280">
                                    PLEASE SELECT AN AUDIO! USE HEADPHONES! ദ്ദി(0⩊&lt;マ
                                    PLEASE SELECT AN AUDIO! USE HEADPHONES! ദ്ദി(0⩊&lt;マ
                                </textPath>
                            </text>
                        </g>

                        <g class="cdText cdText-active-play">
                            <text>
                                <textPath href="#cdTextPath" textLength="280">
                                    NOW PLAYING! USE HEADPHONES! TURN UP THE VOLUME!
                                    NOW PLAYING! USE HEADPHONES! TURN UP THE VOLUME!
                                </textPath>
                            </text>
                        </g>

                        <g class="cdText cdText-active-pause">
                            <text>
                                <textPath href="#cdTextPath" textLength="280">
                                    DISC READY! USE HEADPHONES! TURN UP THE VOLUME!
                                    DISC READY! USE HEADPHONES! TURN UP THE VOLUME!
                                </textPath>
                            </text>
                        </g>
                    </svg>
                </div>
            </div>
        </section>

        <section id="games" class="page">
            <div class="games-gallery gallery">

            </div>
        </section>

        <section id="websites" class="page">
            <div class="websites-gallery gallery">

            </div>
        </section>
    </main>

    <script src="script/indexnavigation.js"></script>
    <script src="script/mobilenavigation.js"></script>
    <script src="script/gallery.js"></script>
    <script src="script/music.js"></script>
    <script src="script/gameweb.js"></script>
</body>

</html>
